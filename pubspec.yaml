name: bloc_manager
description: Flutter BLoC management package that eliminates boilerplate code with sealed BaseState, BlocManager, and caching/pagination/refresh mixins.
version: 1.5.2
homepage: https://sirteefyapps.com.ng/
repository: https://github.com/Teewhydot/bloc_manager
issue_tracker: https://github.com/Teewhydot/bloc_manager/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  bloc: ^9.0.0
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5
  meta: ^1.15.0
  flutter_spinkit: ^5.2.1
  loading_overlay: ">=0.3.0 <1.0.0"
  ansicolor: ^2.0.2
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  # No assets or fonts needed for this package
